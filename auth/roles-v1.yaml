contract: karyalay-mail-contracts/auth/roles
contract_version: 0.2.0
sources:
  role_catalog: "Karyalay Email Master Architecture & Integration Contract v1.0 §10.2, §10.3"
  default_permissions: "karyalay-mail repository-spec-v1.0 Appendix B (inverted)"
rules:
  - "The role catalog is the Master Contract's; a repository may not add a role at a shared boundary."
  - default_permissions is the inverse index of auth/permissions-v1.yaml and carries no independent authority.
  - "A role with an empty default_permissions set is defined by the Master Contract but granted nothing by Repo 1 Appendix B; see ADR-KEM-007."
roles:
  - role: org_owner
    scope: customer
    baseline_purpose: "highest customer authority, subscription ownership, administrator appointment, destructive organisation actions"
    default_permissions:
      - permission: organisation.view
      - permission: organisation.manage
      - permission: member.view
      - permission: member.manage_roles
      - permission: entitlement.view
      - permission: domain.view
      - permission: domain.create
      - permission: domain.manage
      - permission: domain.delete
      - permission: domain.dkim_rotate
      - permission: mailbox.view
      - permission: mailbox.create
      - permission: mailbox.manage
      - permission: mailbox.suspend
      - permission: mailbox.delete
      - permission: alias.view
      - permission: alias.manage
      - permission: group.view
      - permission: group.manage
      - permission: forwarding.manage_any
      - permission: audit.view
  - role: mail_admin
    scope: customer
    baseline_purpose: "domains, mailboxes, aliases, groups, domain policy and routine security administration"
    default_permissions:
      - permission: organisation.view
      - permission: organisation.manage
      - permission: member.view
      - permission: entitlement.view
      - permission: domain.view
      - permission: domain.create
      - permission: domain.manage
      - permission: domain.delete
      - permission: domain.dkim_rotate
      - permission: mailbox.view
      - permission: mailbox.create
      - permission: mailbox.manage
      - permission: mailbox.suspend
      - permission: mailbox.delete
      - permission: alias.view
      - permission: alias.manage
      - permission: group.view
      - permission: group.manage
      - permission: forwarding.manage_any
  - role: helpdesk_admin
    scope: customer
    baseline_purpose: limited password/session/mailbox support without high-risk domain/policy/destructive powers
    default_permissions:
      - permission: domain.view
      - permission: mailbox.view
      - permission: alias.view
      - permission: group.view
  - role: security_admin
    scope: customer
    baseline_purpose: "security policy, sessions, MFA enforcement, security events and account restriction"
    default_permissions:
      - permission: domain.dkim_rotate
      - permission: mailbox.suspend
      - permission: forwarding.manage_any
      - permission: security.sessions_view
      - permission: security.sessions_revoke
      - permission: security.mfa_admin
      - permission: audit.view
  - role: billing_admin
    scope: customer
    baseline_purpose: "plan, invoices, storage/purchased entitlements; no mailbox-content power"
    default_permissions:
      - permission: organisation.view
      - permission: entitlement.view
  - role: auditor
    scope: customer
    baseline_purpose: read-only approved audit/security views
    default_permissions:
      - permission: organisation.view
      - permission: member.view
      - permission: entitlement.view
      - permission: domain.view
      - permission: mailbox.view
        condition: metadata only
      - permission: alias.view
      - permission: group.view
      - permission: audit.view
  - role: mailbox_user
    scope: customer
    baseline_purpose: "own mailbox, preferences, identities/aliases as allowed, own sessions/security"
    default_permissions:
      - permission: security.sessions_view
        condition: own
      - permission: security.sessions_revoke
        condition: own
      - permission: mail.read
        condition: or explicit mailbox_access_grant
      - permission: mail.write
        condition: or explicit mailbox_access_grant
      - permission: mail.send
        condition: or explicit send grant plus sender_authorization
      - permission: mail.settings
        condition: or explicit manage_settings grant
      - permission: app_password.manage_own
  - role: platform_ops
    scope: platform
    baseline_purpose: infrastructure/service health and controlled operational actions
    default_permissions:
      - permission: platform.resource_view
      - permission: platform.restrict
  - role: platform_support
    scope: platform
    baseline_purpose: "customer troubleshooting with metadata access; no default content access"
    default_permissions:
      - permission: organisation.view
      - permission: platform.resource_view
  - role: platform_security
    scope: platform
    baseline_purpose: security incident controls and privileged investigations
    default_permissions: []
  - role: abuse_analyst
    scope: platform
    baseline_purpose: "outbound/inbound abuse cases, restriction recommendations/actions according to policy"
    default_permissions:
      - permission: platform.restrict
  - role: deliverability_analyst
    scope: platform
    baseline_purpose: IP/domain/provider reputation and delivery diagnostics
    default_permissions: []
  - role: platform_billing
    scope: platform
    baseline_purpose: commercial subscription support
    default_permissions: []
  - role: break_glass_admin
    scope: platform
    baseline_purpose: "exceptional emergency authority; no standing everyday use"
    default_permissions:
      - permission: platform.break_glass
        condition: only
