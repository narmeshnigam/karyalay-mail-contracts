  semantics_reference: "karyalay-mail repository-spec-v1.0 §18.1; Master §7.5, §10.3"
  note: "Referenced, not defined here. §18.1 requires a separately designed short-lived elevated workflow with reason/ticket capture, stronger authentication, optional dual approval, prominent audit/security events and automatic expiry. It cannot be implemented by a hidden master password, a shared credential, or a database role granted to the web process."
object_relations:
  - resource: Organisation
    relation_requirement: Active membership unless platform-scoped elevation.
  - resource: Domain
    relation_requirement: domain.organisation_id equals TenantContext organisation.
  - resource: Mailbox admin
    relation_requirement: mailbox.organisation_id equals tenant and permission grants admin action.
  - resource: Mailbox user
    relation_requirement: Principal is mailbox owner mapping or active mailbox_access_grant with required scope.
  - resource: Alias/group
    relation_requirement: Resource belongs to tenant/domain and permission applies.
  - resource: Sender identity
    relation_requirement: Identity bound to target mailbox by sender_authorization and principal has mail.send.
  - resource: Audit/security export
    relation_requirement: "Tenant permission and export type allowed; platform fields redacted."
  - resource: Platform diagnostics
    relation_requirement: "Service/platform scope + explicit elevated repository path; customer content excluded."
