    - "Role defaults below are seed/policy guidance, not a shortcut to role-name checks (Repo 1 Appendix B preamble)."
    - "UI hiding is not authorization (Master Appendix B.1)."
    - "Roles are tenant-scoped (Master §10.2)."
break_glass:
