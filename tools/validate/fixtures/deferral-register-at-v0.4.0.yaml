# `v0.4.0` was tagged: ADR-KEM-009's seven deferrals to `v0.2.0` all still
# open, three tags after their target, with no owning task on any of them.
#
# It exists so the check in deferrals.mjs can be watched failing on the exact
# situation it was written for. A check nobody has seen fail is a check nobody
