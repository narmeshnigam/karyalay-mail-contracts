          "$ref": "#/components/responses/E401"
        "403":
          "$ref": "#/components/responses/E403"
        "404":
          "$ref": "#/components/responses/E404"
        "409":
          "$ref": "#/components/responses/E409"
        "422":
          "$ref": "#/components/responses/E422"
        "429":
          "$ref": "#/components/responses/E429"
        "500":
          "$ref": "#/components/responses/E500"
        "503":
          "$ref": "#/components/responses/E503"
components:
  schemas:
    ValidationError:
      type: object
      description: "One structured, bounded validation error (Repo 1 §26.1 `errors[]`)."
      properties:
        field:
          type: string
          description: JSON Pointer to the offending member.
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        detail:
          type: string
          maxLength: 512
      required:
        - field
        - code
      "$comment": "Source: Repo 1 §26.1."
    Contact:
      type: object
      description: "A personal contact. Private to the mailbox principal, not shared across the organisation (D-04, ADR-KEM-010)."
      properties:
        contact_id:
          type: string
          format: uuid
        display_name:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        addresses:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
          minItems: 1
          maxItems: 16
          description: "Normalized addresses, hard bounded."
        organisation:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
          description: Free-text employer or organisation label. Unrelated to the tenant organisation_id.
        notes:
          oneOf:
            - type: string
              maxLength: 2048
            - type: "null"
        version:
          type: integer
          minimum: 1
          description: "Optimistic concurrency version; surfaced as the ETag (Master §24.5)."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - contact_id
        - addresses
        - version
        - created_at
        - updated_at
      "$comment": "Source: delta D-04 accepted by ADR-KEM-010."
    AddressDisplay:
      type: object
      description: One display address.
      properties:
        address:
          type: string
          format: idn-email
        display_name:
          oneOf:
            - type: string
            - type: "null"
      required:
        - address
      "$comment": "Source: Repo 1 §20.2."
    ContactWrite:
      type: object
      description: "Create or update a personal contact. The server normalizes addresses; the client does not choose contact_id or version."
      properties:
        display_name:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        addresses:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
          minItems: 1
          maxItems: 16
        organisation:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        notes:
          oneOf:
            - type: string
              maxLength: 2048
            - type: "null"
      required:
        - addresses
      "$comment": "Source: delta D-04 accepted by ADR-KEM-010."
    Cursor:
      type:
        - string
        - "null"
      description: "Opaque pagination cursor. Clients do not construct, parse or reorder cursors (Master §20.4, Repo 1 §26)."
    ThreadSummary:
      type: object
      description: "One thread in a folder or search scope. The list form of the C.80 projection, so a client never re-threads message pages itself (D-01, ADR-KEM-010)."
      properties:
        thread_ref:
          type: string
          description: "Opaque thread reference; the same application projection C.80 returns, not an authoritative mail storage key."
        subject:
          oneOf:
            - type: string
            - type: "null"
        participants:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
          maxItems: 32
          description: "Distinct participants, most recent first, hard bounded. An unbounded list on a long thread is payload amplification the sender controls by replying."
        message_count:
          type: integer
          minimum: 1
        unread_count:
          type: integer
          minimum: 0
        has_attachments:
          type: boolean
        latest:
          "$ref": "#/components/schemas/MessageSummary"
      required:
        - thread_ref
        - message_count
        - unread_count
        - has_attachments
        - latest
      "$comment": "Source: Repo 1 §21.1; delta D-01 accepted by ADR-KEM-010."
    MessageSummary:
      type: object
      description: "List-view message metadata. Metadata only — no body (C.70 notes)."
      properties:
        message_ref:
          type: string
          description: "Opaque and integrity protected; binds mailbox, folder, backend locator and UIDVALIDITY-equivalent (Repo 1 §20.3)."
        thread_ref:
          oneOf:
            - type: string
            - type: "null"
        from:
          "$ref": "#/components/schemas/AddressDisplay"
        to:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        cc:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        subject:
          oneOf:
            - type: string
            - type: "null"
        sent_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        internal_at:
          type: string
          format: date-time
        flags:
          type: array
          items:
            type: string
        size_bytes:
          type: integer
          minimum: 0
        has_attachments:
          type: boolean
        snippet:
          oneOf:
            - type: string
              maxLength: 512
            - type: "null"
          description: "Included only where safely available (Repo 1 §20.2)."
      required:
        - message_ref
        - from
        - internal_at
        - flags
        - size_bytes
        - has_attachments
      "$comment": "Source: Repo 1 §20.2 message summary."
    SubmissionRecord:
      type: object
      description: "The Karyalay submission boundary outcome. It does NOT claim remote delivery (C.91 notes)."
      properties:
        submission_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
            - STATUS_UNKNOWN
        smtp_queue_id:
          oneOf:
            - type: string
              maxLength: 64
            - type: "null"
        accepted_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        sent_copy_state:
          type: string
          maxLength: 32
        last_error_code:
          oneOf:
            - type: string
              pattern: "^[A-Z][A-Z0-9_]*$"
            - type: "null"
      required:
        - submission_id
        - state
        - sent_copy_state
      "$comment": "Source: Repo 1 Appendix A.34 send_submission_records; §23.1, §33.6. Withheld: idempotency_key and message_fingerprint — replay-detection inputs, not client-readable state."
    SendRequest:
      type: object
      description: "Final send. Idempotency-Key is mandatory (C.90 notes)."
      properties:
        draft_ref:
          type: string
          description: "Send an existing draft, or supply the structured payload instead."
        message:
          "$ref": "#/components/schemas/DraftWrite"
      "$comment": "Source: Repo 1 §23.1."
    DraftWrite:
      type: object
      description: "Structured compose payload. The server builds standards-compliant MIME from it (C.83 notes); the client never supplies raw MIME."
      properties:
        identity_id:
          type: string
          format: uuid
        to:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        cc:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        bcc:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        staged_attachment_ids:
          type: array
          items:
            type: string
            format: uuid
        in_reply_to_message_ref:
          type: string
      "$comment": "Source: Repo 1 §22.2 compose payload."
    StagedAttachment:
      type: object
      description: "A staged compose attachment. Owner- and mailbox-bound; never a public URL (C.88 notes)."
      properties:
        attachment_id:
          type: string
          format: uuid
        filename_safe:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        content_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        scan_state:
          type: string
          enum:
            - PENDING
            - CLEAN
            - BLOCKED
            - ERROR
        expires_at:
          type: string
          format: date-time
      required:
        - attachment_id
        - filename_safe
        - media_type
        - size_bytes
        - scan_state
        - expires_at
      "$comment": "Source: Repo 1 Appendix A.35 staged_attachments; §25.2. Withheld: storage_ref — the internal object location."
    Draft:
      type: object
      description: "A draft. Drafts live in the backend Drafts folder (C.82 notes)."
      properties:
        draft_ref:
          type: string
          description: Opaque draft reference.
        envelope:
          "$ref": "#/components/schemas/MessageEnvelope"
        body_text:
          oneOf:
            - type: string
            - type: "null"
        body_html:
          oneOf:
            - type: string
            - type: "null"
        attachments:
          type: array
          items:
            "$ref": "#/components/schemas/AttachmentDescriptor"
        identity_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        updated_at:
          type: string
          format: date-time
      required:
        - draft_ref
        - envelope
        - updated_at
      "$comment": "Source: Repo 1 §22."
    AttachmentDescriptor:
      type: object
      description: An attachment descriptor. Bytes stream from the attachment endpoint.
      properties:
        part_ref:
          type: string
        filename_safe:
          type: string
          description: "Sanitised filename (Repo 1 §25.1)."
        media_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        inline:
          type: boolean
      required:
        - part_ref
        - filename_safe
        - media_type
        - size_bytes
        - inline
      "$comment": "Source: Repo 1 §25.1."
    MessageEnvelope:
      type: object
      description: Normalised message envelope.
      properties:
        from:
          "$ref": "#/components/schemas/AddressDisplay"
        reply_to:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        to:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        cc:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        bcc:
          type: array
          items:
            "$ref": "#/components/schemas/AddressDisplay"
        subject:
          oneOf:
            - type: string
            - type: "null"
        sent_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - from
        - to
      "$comment": "Source: Repo 1 §20.2."
    SearchResult:
      type: object
      description: "Search results. The query is parsed to a typed AST; raw backend syntax is never interpolated (C.81 notes)."
      properties:
        messages:
          type: array
          items:
            "$ref": "#/components/schemas/MessageSummary"
        next_cursor:
          oneOf:
            - type: string
            - type: "null"
        truncated:
          type: boolean
          description: True when a result or time limit stopped the search short.
      required:
        - messages
        - next_cursor
        - truncated
      "$comment": "Source: Repo 1 §21.2."
    Thread:
      type: object
      description: "A thread projection. Thread identity is an application projection, not an authoritative mail storage key (C.80 notes)."
      properties:
        thread_ref:
          type: string
        messages:
          type: array
          items:
            "$ref": "#/components/schemas/MessageSummary"
      required:
        - thread_ref
        - messages
      "$comment": "Source: Repo 1 §21.1."
    BulkMutationResult:
      type: object
      description: "Per-item outcome. Returned per item where partial backend semantics are unavoidable (C.76 notes) — a partial failure is never reported as overall success."
      properties:
        results:
          type: array
          items:
            type: object
            description: "One item's outcome."
            properties:
              message_ref:
                type: string
              outcome:
                type: string
                enum:
                  - success
                  - failure
              code:
                oneOf:
                  - type: string
                    pattern: "^[A-Z][A-Z0-9_]*$"
                  - type: "null"
                description: A code from errors/error-catalog-v1.yaml when the item failed.
            required:
              - message_ref
              - outcome
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
      required:
        - results
        - succeeded
        - failed
      "$comment": "Source: Repo 1 §24, §24.1."
    ExpungeRequest:
      type: object
      description: "Permanently remove messages. Never implicit on an ordinary delete; requires strong confirmation (C.79 notes)."
      properties:
        message_refs:
          type: array
          items:
            type: string
          minItems: 1
        confirm:
          type: boolean
          const: true
      required:
        - message_refs
        - confirm
      "$comment": "Source: Repo 1 §24."
    MessageRefBatch:
      type: object
      description: "A bounded batch of message references. Exceeding the limit is MESSAGE_BATCH_LIMIT (Repo 1 §24.1)."
      properties:
        message_refs:
          type: array
          items:
            type: string
          minItems: 1
      required:
        - message_refs
      "$comment": "Source: Repo 1 §24, §24.1."
    MessageTransferRequest:
      type: object
      description: Move or copy a bounded batch to a destination folder.
      properties:
        message_refs:
          type: array
          items:
            type: string
          minItems: 1
        destination_folder_ref:
          type: string
      required:
        - message_refs
        - destination_folder_ref
      "$comment": "Source: Repo 1 §24."
    FlagMutationRequest:
      type: object
      description: "Add or remove flags across a bounded batch. Flag semantics are idempotent (C.75 notes)."
      properties:
        message_refs:
          type: array
          items:
            type: string
          minItems: 1
        add_flags:
          type: array
          items:
            type: string
        remove_flags:
          type: array
          items:
            type: string
      required:
        - message_refs
      "$comment": "Source: Repo 1 §24."
    MessageContent:
      type: object
      description: "Renderable message content after the sanitization and render policy has been applied (C.72 notes, Repo 2 Appendix Q)."
      properties:
        message_ref:
          type: string
        content_type:
          type: string
          enum:
            - text/html
            - text/plain
        content:
          type: string
        sanitizer_outcome:
          type: string
          maxLength: 64
        blocked_remote_resources:
          type: integer
          minimum: 0
      required:
        - message_ref
        - content_type
        - content
        - sanitizer_outcome
      "$comment": "Source: Repo 1 §20.2; karyalay-webmail Appendix Q."
    MessageView:
      type: object
      description: "Full message view: normalised envelope, parsed body structure and part descriptors. Raw MIME streams only from the raw endpoint (Repo 1 §20.2)."
      properties:
        message_ref:
          type: string
        thread_ref:
          oneOf:
            - type: string
            - type: "null"
        envelope:
          "$ref": "#/components/schemas/MessageEnvelope"
        body_parts:
          type: array
          items:
            "$ref": "#/components/schemas/BodyPartDescriptor"
        attachments:
          type: array
          items:
            "$ref": "#/components/schemas/AttachmentDescriptor"
        flags:
          type: array
          items:
            type: string
        size_bytes:
          type: integer
          minimum: 0
      required:
        - message_ref
        - envelope
        - body_parts
        - attachments
        - flags
        - size_bytes
      "$comment": "Source: Repo 1 §20.2."
    BodyPartDescriptor:
      type: object
      description: An allowed body-part descriptor.
      properties:
        part_ref:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        charset:
          oneOf:
            - type: string
            - type: "null"
      required:
        - part_ref
        - media_type
        - size_bytes
      "$comment": "Source: Repo 1 §20.2."
    Folder:
      type: object
      description: One mailbox folder.
      properties:
        folder_ref:
          type: string
          description: "Opaque, integrity-protected locator. Never a raw filesystem path (Repo 1 §20.1)."
        display_name:
          type: string
          maxLength: 255
        special_use:
          oneOf:
            - type: string
              enum:
                - INBOX
                - SENT
                - DRAFTS
                - TRASH
                - JUNK
                - ARCHIVE
            - type: "null"
        message_count:
          type: integer
          minimum: 0
        unread_count:
          type: integer
          minimum: 0
        counts_observed_at:
          type: string
          format: date-time
        rights:
          type: array
          items:
            type: string
          description: "Derived from the mailbox grant and backend capability; never trusted from the client (Repo 1 §20.1)."
        protected:
          type: boolean
          description: "A special-use folder that cannot be renamed or deleted (FOLDER_PROTECTED)."
      required:
        - folder_ref
        - display_name
        - special_use
        - rights
        - protected
      "$comment": "Source: Repo 1 §20.1 folder model."
    FolderUpdate:
      type: object
      description: "Rename or move a folder. Protected folders cannot be renamed (C.68 notes)."
      properties:
        display_name:
          type: string
          maxLength: 255
        parent_folder_ref:
          oneOf:
            - type: string
            - type: "null"
      "$comment": "Source: Repo 1 §20.1."
    FolderCreate:
      type: object
      description: "Create a folder. Reserved and special-use names are protected (C.67 notes)."
      properties:
        display_name:
          type: string
          maxLength: 255
        parent_folder_ref:
          type: string
      required:
        - display_name
      "$comment": "Source: Repo 1 §20.1."
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: "Bounded page size. No total_count is returned unless it is efficient and explicit (Repo 1 §26)."
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque cursor from a previous page's `next_cursor`."
      schema:
        "$ref": "#/components/schemas/Cursor"
  headers:
    RequestId:
      description: "Echo of the accepted or generated `X-Request-ID` (Repo 1 §26, Master §20.7)."
      schema:
        type: string
        maxLength: 128
    RetryAfter:
      description: "Delay before retrying, for codes in the RETRY_AFTER class (Repo 1 §39)."
      schema:
        type: integer
        minimum: 0
    ETag:
      description: "Optimistic concurrency token. Supply it as `If-Match` on the next update (Master §20.6)."
      schema:
        type: string
  responses:
    E503:
      description: "DEPENDENCY_UNAVAILABLE — Required external/internal dependency unavailable. (RETRYABLE_BACKOFF)\nDKIM_ROTATION_FAILED — Rotation needs intervention. (OPERATOR_ATTENTION)\nDNS_RESOLUTION_TEMPORARY_FAILURE — Resolver/network temporary failure. (RETRYABLE_BACKOFF)\nMAIL_STORAGE_UNAVAILABLE — Mailbox backend unavailable. (RETRYABLE_BACKOFF)\nPROVISIONING_FAILED — Provisioning failure needs action. (OPERATOR_ATTENTION)\nSEARCH_UNAVAILABLE — Search/FTS dependency unavailable. (RETRYABLE_BACKOFF)\nSUBMISSION_TEMPORARY_FAILURE — SMTP did not accept; safe retry with same idempotency key. (RETRYABLE_BACKOFF)"
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            type: object
            description: "RFC 9457 problem details for HTTP 503. `code` is narrowed to the catalog codes that map to this status."
            required:
              - type
              - title
              - status
              - code
            properties:
              type:
                type: string
                format: uri
                description: "https://errors.karyalay.in/mail/{code}"
              title:
                type: string
              status:
                type: integer
                minimum: 100
                maximum: 599
                const: 503
              code:
                type: string
                description: A code from errors/error-catalog-v1.yaml whose default HTTP mapping is 503.
                enum:
                  - DEPENDENCY_UNAVAILABLE
                  - DKIM_ROTATION_FAILED
                  - DNS_RESOLUTION_TEMPORARY_FAILURE
                  - MAIL_STORAGE_UNAVAILABLE
                  - PROVISIONING_FAILED
                  - SEARCH_UNAVAILABLE
                  - SUBMISSION_TEMPORARY_FAILURE
              detail:
                type: string
                description: "Operator- and user-safe. Never SQL, a file path, a stack trace, an internal IP or another tenant's address (Master §23.5, Repo 1 §39)."
              request_id:
                type: string
                maxLength: 128
              trace_id:
                type: string
                pattern: "^[0-9a-f]{32}$"
              errors:
                type: array
                items:
                  "$ref": "#/components/schemas/ValidationError"
    E500:
      description: "INTERNAL_ERROR — Unexpected internal error; safe generic detail only. (OPERATOR_ATTENTION)"
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            type: object
            description: "RFC 9457 problem details for HTTP 500. `code` is narrowed to the catalog codes that map to this status."
            required:
              - type
              - title
              - status
              - code
            properties:
              type:
                type: string
                format: uri
                description: "https://errors.karyalay.in/mail/{code}"
              title:
                type: string
              status:
                type: integer
                minimum: 100
                maximum: 599
                const: 500
              code:
                type: string
                description: A code from errors/error-catalog-v1.yaml whose default HTTP mapping is 500.
                enum:
                  - INTERNAL_ERROR
              detail:
                type: string
                description: "Operator- and user-safe. Never SQL, a file path, a stack trace, an internal IP or another tenant's address (Master §23.5, Repo 1 §39)."
              request_id:
                type: string
                maxLength: 128
              trace_id:
                type: string
                pattern: "^[0-9a-f]{32}$"
              errors:
                type: array
                items:
                  "$ref": "#/components/schemas/ValidationError"
    E429:
      description: "RATE_LIMIT_EXCEEDED — Rate policy exceeded. (RETRY_AFTER)"
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Retry-After:
          "$ref": "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            type: object
            description: "RFC 9457 problem details for HTTP 429. `code` is narrowed to the catalog codes that map to this status."
            required:
              - type
              - title
              - status
              - code
            properties:
              type:
                type: string
                format: uri
                description: "https://errors.karyalay.in/mail/{code}"
              title:
                type: string
              status:
                type: integer
                minimum: 100
                maximum: 599
                const: 429
              code:
                type: string
                description: A code from errors/error-catalog-v1.yaml whose default HTTP mapping is 429.
                enum:
                  - RATE_LIMIT_EXCEEDED
              detail:
                type: string
                description: "Operator- and user-safe. Never SQL, a file path, a stack trace, an internal IP or another tenant's address (Master §23.5, Repo 1 §39)."
              request_id:
                type: string
                maxLength: 128
              trace_id:
                type: string
                pattern: "^[0-9a-f]{32}$"
              errors:
                type: array
                items:
                  "$ref": "#/components/schemas/ValidationError"
    E422:
