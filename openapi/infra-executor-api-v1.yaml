              title:
                type: string
              status:
                type: integer
                minimum: 100
                maximum: 599
                const: 400
              code:
                type: string
                description: A code from errors/error-catalog-v1.yaml whose default HTTP mapping is 400.
                enum:
                  - IDEMPOTENCY_KEY_REQUIRED
              detail:
                type: string
                description: "Operator- and user-safe. Never SQL, a file path, a stack trace, an internal IP or another tenant's address (Master §23.5)."
              request_id:
                type: string
                maxLength: 128
              trace_id:
                type: string
                pattern: "^[0-9a-f]{32}$"
              errors:
                type: array
