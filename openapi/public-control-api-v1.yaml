      type: object
      description: "One role granted to a subject, optionally scoped below the organisation."
      properties:
        role_code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 64
          description: A role from auth/roles-v1.yaml.
        scope_type:
          type: string
          enum:
            - ORGANISATION
            - DOMAIN
            - MAILBOX
        scope_id:
          oneOf:
            - type: string
