        domain_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        ascii_name:
          type: string
          maxLength: 253
          description: "IDNA A-label canonical form (Master §6.4)."
        unicode_name:
          oneOf:
            - type: string
              maxLength: 253
            - type: "null"
          description: "Display form; never a routing key."
        state:
          type: string
          enum:
            - REQUESTED
            - OWNERSHIP_PENDING
            - VERIFIED
            - CONFIGURING
            - READY_FOR_CUTOVER
            - ACTIVE
            - SUSPENDED
            - DELETION_PENDING
            - RELEASED
        desired_generation:
          type: integer
          minimum: 0
        observed_generation:
          type: integer
          minimum: 0
        readiness:
          "$ref": "#/components/schemas/DomainReadiness"
        policy:
          "$ref": "#/components/schemas/DomainPolicy"
        version:
          type: integer
          minimum: 1
          description: "Optimistic concurrency version; surfaced as the ETag (Master §24.5)."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - domain_id
        - organisation_id
        - ascii_name
        - state
        - desired_generation
        - observed_generation
        - version
      "$comment": "Source: Repo 1 Appendix A.5 mail_domains, A.9 domain_policies; Appendix F.2 state machine. Withheld: primary_dkim_keyset_id — an internal foreign key; DKIM state is served by C.18."
    DomainPolicy:
      type: object
      description: Per-domain product policy knobs.
      properties:
        allow_external_forwarding:
          type: boolean
        allow_catch_all:
          type: boolean
        max_message_bytes:
          type: integer
          minimum: 0
        max_recipients:
          type: integer
          minimum: 1
        retention_profile:
          type: string
          maxLength: 64
      "$comment": "Source: Repo 1 Appendix A.9 domain_policies."
    DomainReadiness:
      type: object
      description: "The three gates of dns/domain-record-contract-v1.yaml, evaluated on a fresh snapshot."
      properties:
        ownership:
          "$ref": "#/components/schemas/HealthState"
        dns_readiness:
          "$ref": "#/components/schemas/HealthState"
        infrastructure:
          "$ref": "#/components/schemas/HealthState"
        evaluated_at:
          type: string
          format: date-time
      required:
        - ownership
        - dns_readiness
        - infrastructure
        - evaluated_at
      "$comment": "Source: Repo 1 §10; dns/domain-record-contract-v1.yaml gates."
    HealthState:
      type: string
      enum:
        - PASS
        - WARN
        - FAIL
        - PENDING
        - NOT_APPLICABLE
      description: "Master §12.4. A single green boolean is explicitly insufficient."
    ProvisioningOperation:
      type: object
      description: A typed provisioning operation and its lifecycle state.
      properties:
        operation_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum:
            - DOMAIN
            - MAILBOX
            - DKIM
            - FILTER
            - QUOTA
            - PLACEMENT
        resource_id:
          type: string
          format: uuid
        operation_type:
          type: string
          maxLength: 48
        generation:
          type: integer
          minimum: 0
        state:
          type: string
          enum:
            - REQUESTED
            - DISPATCH_PENDING
            - IN_PROGRESS
            - SUCCEEDED
            - RETRYABLE_FAILURE
            - FAILED_ACTION_REQUIRED
            - CANCELLED
        attempt_count:
          type: integer
          minimum: 0
        next_attempt_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        last_error_code:
          oneOf:
            - type: string
              pattern: "^[A-Z][A-Z0-9_]*$"
            - type: "null"
      required:
        - operation_id
        - organisation_id
        - resource_type
        - resource_id
        - operation_type
        - generation
        - state
      "$comment": "Source: Repo 1 Appendix A.31 provisioning_operations; §33.5. Withheld: idempotency_key — a replay-detection input, echoed to nobody."
    DomainDnsStatus:
      type: object
      description: "Per-record requirement, latest observation and remediation guidance."
      properties:
        domain_id:
          type: string
          format: uuid
        generation:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            "$ref": "#/components/schemas/DomainDnsRecordStatus"
      required:
        - domain_id
        - generation
        - records
      "$comment": "Source: Repo 1 Appendix A.7/A.8; dns/domain-record-contract-v1.yaml."
    DomainDnsRecordStatus:
      type: object
      description: One required or recommended record and what the resolver last saw.
      properties:
        record_kind:
          type: string
          enum:
            - VERIFICATION_TXT
            - MX
            - SPF
            - DKIM
            - DMARC
            - AUTOCONFIG
            - AUTODISCOVER
            - MTA_STS
            - TLS_RPT
            - CAA
        name:
          type: string
          maxLength: 255
        expected:
          type: object
          description: "Normalised expected value or policy (Repo 1 Appendix A.7 expected_json)."
        observed:
          oneOf:
            - type: object
            - type: "null"
          description: "Normalised safe observed values (Repo 1 Appendix A.8 observed_json)."
        required_for_activation:
          type: boolean
        observation_status:
          type: string
          enum:
            - MATCH
            - MISSING
            - MISMATCH
            - TEMPORARY_ERROR
        health_state:
          "$ref": "#/components/schemas/HealthState"
        checked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
          description: Freshness boundary. A stale observation cannot satisfy a gate.
        remediation:
          type: string
          description: "Operator-safe guidance (Master §12.4)."
      required:
        - record_kind
        - name
        - expected
        - required_for_activation
        - observation_status
        - health_state
      "$comment": "Source: Repo 1 Appendix A.7, A.8; Master §12.4. Withheld: resolver_trace_id — diagnostic correlation, not customer-facing."
    DomainVerificationChallenge:
      type: object
      description: "The verification record the customer must publish. The raw token is returned exactly once, at creation or renewal (C.11 notes)."
      properties:
        verification_id:
          type: string
          format: uuid
        method:
          type: string
          const: DNS_TXT
          description: "DNS_TXT for v1 (Repo 1 Appendix A.6)."
        record_name:
          type: string
          maxLength: 255
        record_value:
          type: string
          description: Present only in the response that creates or renews the challenge.
        expires_at:
          type: string
          format: date-time
        verified_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        attempt_count:
          type: integer
          minimum: 0
      required:
        - verification_id
        - method
        - record_name
        - expires_at
      "$comment": "Source: Repo 1 Appendix A.6 domain_verifications; §10.1. Withheld: token_hash — the stored hash. Returning it would make the challenge forgeable."
    DomainUpdate:
      type: object
      description: "Change domain policy. May increment desired_generation (C.9 notes)."
      properties:
        policy:
          "$ref": "#/components/schemas/DomainPolicy"
      "$comment": "Source: Repo 1 Appendix A.9."
    DomainCreateRequest:
      type: object
      description: Add a hosted domain.
      properties:
        name:
          type: string
          maxLength: 253
