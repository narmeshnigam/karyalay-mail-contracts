          "$ref": "#/components/responses/E503"
components:
  schemas:
    ValidationError:
      type: object
      description: "One structured, bounded validation error (Repo 1 §26.1 `errors[]`)."
      properties:
        field:
          type: string
          description: JSON Pointer to the offending member.
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        detail:
          type: string
          maxLength: 512
      required:
        - field
        - code
      "$comment": "Source: Repo 1 §26.1."
    Session:
      type: object
      description: "The authenticated session. The bootstrap read Repo 2 Appendix F's AppBootstrap machine needs to reach READY, assembled from state this service already holds (ADR-KEM-011)."
      properties:
        subject:
          type: string
          maxLength: 255
          description: OIDC subject.
        organisation_id:
          type: string
          format: uuid
        mailboxes:
          type: array
          items:
            "$ref": "#/components/schemas/SessionMailbox"
          maxItems: 256
          description: "Every mailbox this session may act on, owned and delegated. Repo 2 §18 makes this exactly the mailbox switcher's contents, so a short list is a smaller switcher and never a hidden mailbox."
        permissions:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 256
          description: "Effective permission codes. Advisory for rendering only: §18 recomputes the five-factor decision per request, so a client may never treat presence here as authorisation."
        locale:
          type: string
          maxLength: 35
          description: BCP 47 language tag.
        server_time:
          type: string
          format: date-time
        capabilities:
          type: object
          additionalProperties:
            type: boolean
          description: Server-authoritative feature availability. A capability absent from this map reads as off.
      required:
        - subject
        - organisation_id
        - mailboxes
        - permissions
        - locale
        - server_time
        - capabilities
      "$comment": "Source: Repo 2 §7 and Appendix F; delta accepted by ADR-KEM-011. Withheld: tokens, refresh material and any credential -- §17.2's CREDENTIAL INVARIANT; a bootstrap read is the most-fetched route in the client"
    SessionMailbox:
      type: object
      description: One mailbox this session may act on.
      properties:
        mailbox_ref:
          type: string
          description: Opaque mailbox reference usable on the C.66-C.114 mailbox routes.
        address:
          type: string
          format: idn-email
        delegated:
          type: boolean
          description: "True when access comes from an access grant (C.34-C.36) rather than ownership."
      required:
        - mailbox_ref
        - address
        - delegated
      "$comment": "Source: Repo 1 Appendix A.17 mailbox_access_grants; delta accepted by ADR-KEM-011."
    Cursor:
      type:
        - string
        - "null"
      description: "Opaque pagination cursor. Clients do not construct, parse or reorder cursors (Master §20.4, Repo 1 §26)."
    DirectoryEntry:
      type: object
      description: "One addressable member of the caller's organisation. Deliberately narrower than Member: an autocomplete needs a name and an address, and every field not returned is a field that cannot leak (D-05, ADR-KEM-010)."
      properties:
        member_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 255
        primary_address:
          type: string
          format: idn-email
        role:
          oneOf:
            - type: string
              maxLength: 64
            - type: "null"
      required:
        - member_id
        - display_name
        - primary_address
      "$comment": "Source: Repo 1 Appendix A.2 organisation_memberships; delta D-05 accepted by ADR-KEM-010. Withheld: entitlements, membership dates and role history -- a directory autocomplete has no use for them and they widen the blast radius of an enumeration"
    Restriction:
      type: object
      description: "An effective restriction. Reason detail is privacy filtered (C.96 notes)."
      properties:
        restriction_id:
          type: string
          format: uuid
        resource_type:
          type: string
          enum:
            - ORGANISATION
            - DOMAIN
            - MAILBOX
        resource_id:
          type: string
          format: uuid
        restriction_code:
          type: string
          enum:
            - SEND_BLOCKED
            - SEND_RATE_REDUCED
            - AUTH_BLOCKED
            - FORWARDING_BLOCKED
            - ADMIN_CHANGES_FROZEN
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          maxLength: 64
        source:
          type: string
          maxLength: 64
        starts_at:
          type: string
          format: date-time
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        cleared_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - restriction_id
        - resource_type
        - resource_id
        - restriction_code
        - starts_at
      "$comment": "Source: Repo 1 Appendix A.30 restrictions; §36."
    DataExportJob:
      type: object
      description: "Asynchronous export job. The artifact is encrypted and expiring (C.94 notes)."
      properties:
        export_id:
          type: string
          format: uuid
        export_type:
          type: string
          maxLength: 64
        state:
          type: string
          maxLength: 32
        requested_by:
          type: string
          maxLength: 255
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        download_url:
          oneOf:
            - type: string
              format: uri
            - type: "null"
          description: "Signed and short-lived; issued only after authorization (C.95 notes)."
        created_at:
          type: string
          format: date-time
      required:
        - export_id
        - export_type
        - state
        - created_at
      "$comment": "Source: Repo 1 Appendix A.42 data_export_jobs; §38. Withheld: storage_ref — the internal object location behind the signed URL."
    DataExportRequest:
      type: object
      description: "Request an export. Export-type authorization applies (C.94 notes)."
      properties:
        export_type:
          type: string
          maxLength: 64
      required:
        - export_type
      "$comment": "Source: Repo 1 §38."
    SecurityEvent:
      type: object
      description: "Tenant-visible security event. Platform-only fields are redacted (C.93 notes)."
      properties:
        security_event_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        event_code:
          type: string
          maxLength: 64
        severity:
          type: string
          enum:
            - INFO
            - NOTICE
            - WARNING
            - ERROR
            - CRITICAL
        status:
          type: string
          maxLength: 32
        mailbox_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        identity_subject:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        details:
          type: object
          description: "Bounded, privacy-filtered detail."
      required:
        - security_event_id
        - occurred_at
        - event_code
        - severity
        - status
      "$comment": "Source: Repo 1 Appendix A.40 security_events; §37.2. Withheld: source and ops_case_ref — platform-only fields (C.93)."
    AuditEvent:
      type: object
      description: "Tenant audit record. Never carries message content (C.92 notes)."
      properties:
        audit_event_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor_type:
          type: string
          maxLength: 32
        actor_id:
          type: string
          maxLength: 255
        action:
          type: string
          maxLength: 128
        resource_type:
          type: string
          maxLength: 32
        resource_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        outcome:
          type: string
          enum:
            - success
            - failure
            - rejected
            - timeout
            - cancelled
            - unknown
        request_id:
          oneOf:
            - type: string
              maxLength: 128
            - type: "null"
        trace_id:
          oneOf:
            - type: string
              pattern: "^[0-9a-f]{32}$"
            - type: "null"
        metadata:
          type: object
      required:
        - audit_event_id
        - occurred_at
        - actor_type
        - action
        - outcome
      "$comment": "Source: Repo 1 Appendix A.39 audit_events; §37.1. Withheld: integrity_hash — the tamper-evidence chain value, verified server-side."
    AppPasswordCreated:
      type: object
      description: "The one and only response that carries the raw secret (Repo 1 §17.2 step 2, C.64 notes)."
      properties:
        credential:
          "$ref": "#/components/schemas/AppPassword"
        secret:
          type: string
          description: "Raw secret, returned exactly once over TLS. At least 128 bits of CSPRNG entropy."
      required:
        - credential
        - secret
      "$comment": "Source: Repo 1 §17.2."
    AppPassword:
      type: object
      description: App password metadata. The secret is never in this representation.
      properties:
        credential_id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 64
        scopes:
          type: array
          items:
            type: string
        last_used_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - credential_id
        - label
        - scopes
      "$comment": "Source: Repo 1 Appendix A.27 app_passwords; §17.2. Withheld: secret_verifier — the stored verifier. §17.2 step 5 is explicit that no endpoint can recover an old secret."
    AppPasswordCreateRequest:
      type: object
      description: "Create an app password. Requires strong re-authentication per policy (C.64 notes)."
      properties:
        label:
          type: string
          maxLength: 64
        scopes:
          type: array
          items:
            type: string
          minItems: 1
        expires_at:
          type: string
          format: date-time
      required:
        - label
      "$comment": "Source: Repo 1 §17.2."
    MailSession:
      type: object
      description: "Privacy-safe session metadata (C.61 notes)."
      properties:
        session_id:
          type: string
          format: uuid
        device_label:
          oneOf:
            - type: string
              maxLength: 128
            - type: "null"
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        current:
          type: boolean
      required:
        - session_id
        - last_seen_at
        - current
      "$comment": "Source: Repo 1 Appendix A.28 mail_sessions; Master §9.5. Withheld: ip_prefix_hash and oidc_session_id — correlation values that would re-identify a device or bridge to the IdP session."
    FilterValidationResult:
      type: object
      description: "Validation outcome. This operation has no side effects (C.60 notes)."
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/ValidationError"
      required:
        - valid
        - errors
      "$comment": "Source: Repo 1 §15.1."
    FilterSetWrite:
      type: object
      description: "Replace the filter set. Compiled deterministically to Sieve; installation is asynchronous (C.59 notes)."
      properties:
        rules:
          type: array
          items:
            "$ref": "#/components/schemas/FilterRule"
      required:
        - rules
      "$comment": "Source: Repo 1 §15.1."
    FilterRule:
      type: object
      description: "One structured filter rule. Structured primitives only; no raw Sieve."
      properties:
        name:
          type: string
          maxLength: 128
        enabled:
          type: boolean
        conditions:
          type: array
          items:
            type: object
          minItems: 1
        actions:
          type: array
          items:
            type: object
          minItems: 1
        stop:
          type: boolean
      required:
        - name
        - enabled
        - conditions
        - actions
      "$comment": "Source: Repo 1 §15.1 structured filter v1 primitives."
    FilterSet:
      type: object
      description: "Structured filters and their installation generation. Never an arbitrary backend script (C.58 notes)."
      properties:
        rules:
          type: array
          items:
            "$ref": "#/components/schemas/FilterRule"
        generation:
          type: integer
          minimum: 0
        observed_generation:
          type: integer
          minimum: 0
        state:
          type: string
          maxLength: 32
      required:
        - rules
        - generation
        - observed_generation
        - state
      "$comment": "Source: Repo 1 Appendix A.26 sieve_filter_sets; §15.1. Withheld: compiled_hash — an internal integrity value over generated Sieve."
    VacationRule:
      type: object
      description: "Vacation responder. Content is returned sanitized (C.56 notes)."
      properties:
        enabled:
          type: boolean
        starts_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        ends_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        subject:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        body_text:
          oneOf:
            - type: string
            - type: "null"
        body_html:
          oneOf:
            - type: string
            - type: "null"
        reply_interval_seconds:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
          description: "Optimistic concurrency version; surfaced as the ETag (Master §24.5)."
      required:
        - enabled
        - reply_interval_seconds
        - version
      "$comment": "Source: Repo 1 Appendix A.25 vacation_rules; §15.2."
    VacationRuleWrite:
      type: object
      description: "Replace the vacation responder. Date range, responder loop suppression and content size are validated (C.57 notes)."
      properties:
        enabled:
          type: boolean
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
