        identity_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        address:
          type: string
          format: idn-email
        display_name:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        reply_to:
          oneOf:
            - type: string
              format: idn-email
            - type: "null"
        is_default:
          type: boolean
        state:
          type: string
          maxLength: 32
      required:
        - identity_id
        - mailbox_id
        - address
        - is_default
        - state
      "$comment": "Source: Repo 1 Appendix A.18 mailbox_identities; §13.2. Withheld: signature_ref — an internal storage pointer, not the signature body."
    MailboxIdentityUpdate:
      type: object
      description: "Change identity presentation. The underlying address cannot change; that needs a new identity (C.44 notes)."
      properties:
        display_name:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        reply_to:
          oneOf:
            - type: string
              format: idn-email
            - type: "null"
        is_default:
          type: boolean
      "$comment": "Source: Repo 1 Appendix A.18."
    MailboxIdentityCreate:
      type: object
      description: "Create a send-as identity. Requires domain/address ownership and sender-authorization rules (C.43 notes)."
      properties:
        address:
          type: string
          format: idn-email
        display_name:
          type: string
          maxLength: 255
        reply_to:
          type: string
          format: idn-email
        is_default:
          type: boolean
      required:
        - address
      "$comment": "Source: Repo 1 §13.2."
    Alias:
      type: object
      description: "Alias and its targets. Targets are shown according to permission and privacy policy (C.39 notes)."
      properties:
        alias_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        address:
          type: string
          format: idn-email
        state:
          type: string
          maxLength: 32
        max_hops:
          type: integer
          minimum: 1
        targets:
          type: array
          items:
            "$ref": "#/components/schemas/AliasTarget"
        version:
          type: integer
          minimum: 1
          description: "Optimistic concurrency version; surfaced as the ETag (Master §24.5)."
      required:
        - alias_id
        - organisation_id
        - domain_id
        - address
        - state
        - targets
        - version
      "$comment": "Source: Repo 1 Appendix A.20 aliases, A.21 alias_targets; §13.1."
    AliasTarget:
      type: object
      description: One alias destination.
      properties:
        target_type:
          type: string
          enum:
            - MAILBOX
            - ALIAS
            - GROUP
            - EXTERNAL
        target_ref:
          type: string
          maxLength: 320
        position:
          type: integer
          minimum: 0
        state:
          type: string
          maxLength: 32
      required:
        - target_type
        - target_ref
      "$comment": "Source: Repo 1 Appendix A.21 alias_targets."
    AliasWrite:
      type: object
      description: "Create or replace an alias. Loop and expansion validation runs across the whole alias/group graph (C.38, C.40 notes)."
      properties:
        local_part:
          type: string
          maxLength: 64
        targets:
          type: array
          items:
            "$ref": "#/components/schemas/AliasTarget"
          minItems: 1
        max_hops:
          type: integer
          minimum: 1
      required:
        - targets
      "$comment": "Source: Repo 1 §13.1."
    MailboxAccessGrant:
      type: object
      description: "Delegated access to a mailbox. Sensitive authorization metadata (C.34 notes)."
      properties:
        grant_id:
          type: string
          format: uuid
        grantee_subject:
          type: string
          maxLength: 255
        scopes:
          type: array
          items:
            type: string
            enum:
              - mail.read
              - mail.write
              - mail.send
              - mail.settings
          minItems: 1
        granted_by:
          type: string
          maxLength: 255
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        revoked_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - grant_id
        - grantee_subject
        - scopes
      "$comment": "Source: Repo 1 Appendix A.17 mailbox_access_grants."
    MailboxAccessGrantRequest:
      type: object
      description: "Grant delegated mailbox access. Scopes are allow-listed and self-escalation is prohibited (C.35 notes)."
      properties:
        grantee_subject:
          type: string
          maxLength: 255
        scopes:
          type: array
          items:
            type: string
            enum:
              - mail.read
              - mail.write
              - mail.send
              - mail.settings
          minItems: 1
        expires_at:
          type: string
          format: date-time
      required:
        - grantee_subject
        - scopes
      "$comment": "Source: Repo 1 §18, Appendix A.17."
    MailboxUsage:
      type: object
      description: "Observed usage. May be stale rather than a synchronous backend query (C.33 notes)."
      properties:
        bytes_used:
          type: integer
          minimum: 0
        message_count:
          type: integer
          minimum: 0
        quota_percent_bp:
          type: integer
          minimum: 0
          description: "Basis points, so 10000 is 100%."
        observed_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: True when the figures predate the freshness policy.
      required:
        - bytes_used
        - message_count
        - observed_at
        - stale
      "$comment": "Source: Repo 1 Appendix A.15 mailbox_usage; §16.1."
    Mailbox:
      type: object
      description: "Mailbox metadata, generations, restrictions and quota summary as authorized (C.26 notes)."
      properties:
        mailbox_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        primary_address:
          type: string
          format: idn-email
        display_name:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        state:
          type: string
          maxLength: 32
        quota_bytes:
          type: integer
          minimum: 0
        desired_generation:
          type: integer
          minimum: 0
        observed_generation:
          type: integer
          minimum: 0
        recovery_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        restrictions:
          type: array
          items:
            "$ref": "#/components/schemas/Restriction"
        usage:
          "$ref": "#/components/schemas/MailboxUsage"
        version:
          type: integer
          minimum: 1
          description: "Optimistic concurrency version; surfaced as the ETag (Master §24.5)."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - mailbox_id
        - organisation_id
        - domain_id
        - primary_address
        - state
        - quota_bytes
        - desired_generation
        - observed_generation
        - version
      "$comment": "Source: Repo 1 Appendix A.13 mailboxes; §12. Withheld: primary_address_id — an internal registry key; the address itself is returned instead."
    ReasonRequest:
      type: object
      description: "Reason for an administrative state change. Mandatory where the card says so (C.16, C.29)."
      properties:
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          maxLength: 64
        detail:
          type: string
          maxLength: 512
      required:
        - reason_code
      "$comment": "Source: Repo 1 Appendix A.30 restrictions.reason_code; C.16/C.29 notes."
    MailboxQuotaUpdate:
      type: object
