  "/api/v1/me/session":
    get:
      operationId: getMySession
      summary: "Return the authenticated session: subject, organisation, authorized mailboxes, permissions, locale and server clock."
      description: "Return the authenticated session: subject, organisation, authorized mailboxes, permissions, locale and server clock.\n\n**Catalog:** Appendix C C.115. **Permission:** `authenticated`.\n\n**Notes:** Bootstrap read (Repo 2 Appendix F AppBootstrap). Mailboxes limited to those this session may act on, including delegated. No secrets, no tokens; server clock included because the client's is unreliable.\n\n**Validation order:** Authentication → tenant/object visibility → permission/state/entitlement/restriction → request validation → concurrency/idempotency → transaction/external effect (Repo 1 Appendix C).\n\n**Audit:** All administrative/security/destructive mutations; ordinary mailbox reads only as privacy/security policy requires.\n**Events:** Emit named domain event when Appendix D defines semantic change; outbox in same transaction.\n**Errors:** Only Appendix E stable codes applicable to path; validation details are structured and bounded.\n**Rate/size:** Endpoint-specific platform/tenant limits; arrays/pages/uploads are hard bounded."
      tags:
        - Sessions
      x-karyalay-catalog-id: C.115
      x-karyalay-permission: authenticated
      responses:
        "200":
          description: Success.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
