      properties:
        quota_bytes:
          type: integer
          minimum: 0
      required:
        - quota_bytes
      "$comment": "Source: Repo 1 §16."
    MailboxUpdate:
      type: object
      description: "Change mailbox metadata. Pure display metadata does not increment the infra generation (Repo 1 §12.3)."
      properties:
        display_name:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
      "$comment": "Source: Repo 1 Appendix A.13, §12.3."
    MailboxCreateRequest:
      type: object
      description: Create a mailbox within entitlement.
      properties:
        domain_id:
          type: string
          format: uuid
        local_part:
          type: string
          maxLength: 64
          description: "Case-insensitive within the domain (Master §6.5). v1 defaults to ASCII local-parts."
        display_name:
          type: string
          maxLength: 255
        quota_bytes:
          type: integer
          minimum: 0
      required:
        - domain_id
        - local_part
      "$comment": "Source: Repo 1 §12.1; Master §6.5."
    DomainTransfer:
      type: object
      description: Controlled cross-organisation domain transfer.
      properties:
        transfer_id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        from_organisation_id:
          type: string
          format: uuid
        to_organisation_id:
          type: string
          format: uuid
        state:
          type: string
          maxLength: 32
        generation:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - transfer_id
        - domain_id
        - from_organisation_id
        - to_organisation_id
        - state
      "$comment": "Source: Repo 1 Appendix A.43 domain_transfer_operations; §10.4. Withheld: approval_json — dual-approval evidence, released only through the audit surface."
    DomainTransferRequest:
      type: object
      description: "Request a controlled tenant transfer. A raw organisation_id update is forbidden (Repo 1 §10.4)."
      properties:
        to_organisation_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 512
      required:
        - to_organisation_id
      "$comment": "Source: Repo 1 §10.4."
    DkimState:
      type: object
      description: "DKIM keyset, its rotation state and the published selectors."
      properties:
        keyset_id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        rotation_state:
          type: string
          maxLength: 32
        rotation_due_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        active_key_id:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
        keys:
          type: array
          items:
            "$ref": "#/components/schemas/DkimKey"
        version:
          type: integer
          minimum: 1
          description: "Optimistic concurrency version; surfaced as the ETag (Master §24.5)."
      required:
        - keyset_id
        - domain_id
        - rotation_state
        - keys
      "$comment": "Source: Repo 1 Appendix A.10 dkim_keysets; §11."
    DkimKey:
      type: object
      description: One DKIM key. Public material only.
      properties:
        key_id:
          type: string
          format: uuid
        selector:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        algorithm:
          type: string
          maxLength: 32
        public_key_b64:
          type: string
          description: "Public key, base64. The only key material any API returns."
        state:
          type: string
          enum:
            - PLANNED
            - PUBLISHED_PENDING
            - ACTIVE
            - ROTATING_OUT
            - RETIRED
            - REVOKED
        activated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        retired_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - key_id
        - selector
        - algorithm
        - public_key_b64
        - state
      "$comment": "Source: Repo 1 Appendix A.11 dkim_keys; Appendix F.3 state machine. Withheld: private_key_ref — NO SECRET TRANSPORT (Repo 1 §11.1). C.18 additionally forbids returning it to non-platform clients."
    DkimRotateRequest:
      type: object
      description: Begin a DKIM rotation.
      properties:
        reason:
          type: string
          maxLength: 512
      "$comment": "Source: Repo 1 §11.1."
    Domain:
      type: object
      description: "Hosted domain, its lifecycle state and its readiness gates."
