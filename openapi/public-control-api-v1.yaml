        state:
          type: string
          maxLength: 32
        created_at:
          type: string
          format: date-time
      required:
        - member_id
        - member_type
        - member_ref
        - state
      "$comment": "Source: Repo 1 Appendix A.23 distribution_group_members; §14.1."
    GroupMemberCreate:
      type: object
      description: "Add a member. Cycle detection runs for nested groups and external member policy is enforced (C.52 notes)."
      properties:
        member_type:
          type: string
          enum:
            - MAILBOX
            - ALIAS
            - GROUP
            - EXTERNAL
        member_ref:
          type: string
          maxLength: 320
      required:
        - member_type
        - member_ref
      "$comment": "Source: Repo 1 §14.1."
    DistributionGroup:
      type: object
      description: "Distribution group. Member visibility is permission-aware (C.48 notes)."
      properties:
        group_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        address:
          type: string
          format: idn-email
        display_name:
          oneOf:
            - type: string
              maxLength: 255
            - type: "null"
        posting_policy:
          type: string
          maxLength: 32
        max_expansion:
          type: integer
          minimum: 1
        state:
          type: string
          maxLength: 32
        version:
          type: integer
          minimum: 1
          description: "Optimistic concurrency version; surfaced as the ETag (Master §24.5)."
      required:
        - group_id
        - organisation_id
        - domain_id
        - address
        - posting_policy
        - state
        - version
      "$comment": "Source: Repo 1 Appendix A.22 distribution_groups; §14."
    DistributionGroupWrite:
      type: object
      description: "Create or change a distribution group. Expansion limit and posting policy are validated (C.47 notes)."
      properties:
        local_part:
          type: string
          maxLength: 64
        display_name:
          type: string
          maxLength: 255
        posting_policy:
          type: string
          maxLength: 32
        max_expansion:
          type: integer
          minimum: 1
      "$comment": "Source: Repo 1 §14."
    MailboxIdentity:
      type: object
      description: A send-as identity bound to a mailbox.
