name: contracts

# The gate ADR-KEM-001 requires on this side: the artifacts are well-formed,
# self-consistent, and identical to what the derivation tools produce from the
# specifications. Consumers prove the other half in their own CI (CONSUMING.md).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Validate every contract artifact
        run: npm run validate

      - name: Lint the OpenAPI documents
        run: npm run lint

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan
        # The binary rather than gitleaks-action@v2: the action needs a licence key
        # for organisation accounts and its failure mode is a red build with no
        # finding, which is indistinguishable from a real leak.
        run: gitleaks detect --source . --no-banner --redact -v

  regeneration-is-clean:
    # A hand-edit to a generated artifact is the failure mode this repository
    # cannot tolerate: it would silently detach the contract from the
    # specification it claims to transcribe. This job is what makes the
    # "GENERATED -- do not hand-edit" header enforceable rather than advisory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: contracts

      - name: Check out the four consumer specifications
        # The generators transcribe appendices FROM the four repository
        # specifications, so this repository cannot regenerate without them.
        #
        # secrets.GITHUB_TOKEN is scoped to THIS repository only -- it cannot
        # read the four consumers while they are private. That is why this job
        # failed on every run before 2026-08-19.
        #
        # SPEC_READ_TOKEN is a fine-grained PAT with read access to the four
        # consumer repositories. Without it this step fails with the message
        # below rather than a bare clone error, because "you need to add a
        # secret" and "the network is down" should not look the same.
        env:
          SPEC_TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          if [ -z "$SPEC_TOKEN" ]; then
            echo "::error::SPEC_READ_TOKEN is not set. The derivation tools read the four consumer repository specifications, which are private, and GITHUB_TOKEN cannot reach another repository."
            echo "::error::Add a fine-grained PAT with Contents:read on karyalay-mail, karyalay-webmail, karyalay-mail-infra and karyalay-mail-ops as the repository secret SPEC_READ_TOKEN."
            exit 1
          fi
          for repo in karyalay-mail karyalay-webmail karyalay-mail-infra karyalay-mail-ops; do
            git clone --depth 1 \
              "https://x-access-token:${SPEC_TOKEN}@github.com/${{ github.repository_owner }}/$repo.git" \
              "$repo"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate from the specifications
        working-directory: contracts
        env:
          SPEC_ROOT: ${{ github.workspace }}
        run: npm run derive

      - name: Fail if regeneration changed anything
        working-directory: contracts
        run: |
          if ! git diff --exit-code; then
            echo "::error::A generated artifact differs from what the derivation tools produce."
            echo "::error::Either an artifact was hand-edited, or a source specification changed."
            echo "::error::If the specification changed, run 'npm run derive' and commit the result with the reconciliation note."
            exit 1
          fi

  tag-is-immutable:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag must be annotated and must not move
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. Master 0.3 requires an annotated tag carrying the release inventory."
            exit 1
          fi
          echo "$TAG is annotated:"
          git tag -n99 "$TAG"
