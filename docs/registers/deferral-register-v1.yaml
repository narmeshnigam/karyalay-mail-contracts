  - id: KEM-003-FENCING
    title: Mailbox storage HA claim — blocked until fencing capability is published
    source: ADR-KEM-003
    deferred_by: ADR-KEM-003
    deferred_on: 2026-08-17
    target:
      gate: 2
    decision_owner: karyalay-mail-infra
    owning_task: karyalay-mail-infra/tasks/phase-07-mailbox-shard-ha/T07.08-ha-capability-statement.md
    status: OPEN
    note: >-
      Included as the well-formed counter-example. The target is a gate rather
      than a tag, so it is not machine-maturable either — but it has a named
      owner and a named task, which is what ADR-KEM-009's deferrals lacked. The
      honesty rule is binding in the interim: no fencing proof means
      single-node with a published RPO/RTO, not a quiet HA claim.
