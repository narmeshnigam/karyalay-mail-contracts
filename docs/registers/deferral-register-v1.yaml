# Karyalay Mail — deferral register
#
# HAND-AUTHORED. Every deferral this repository's ADRs have made, in a form a
# check can read.
#
# Why this file exists
# --------------------
# ADR-KEM-009 (ACCEPTED 2026-08-18) deferred seven Repo 4 deltas to `v0.2.0`
# and named a prerequisite ADR in its own decision. No task was created to
# raise that ADR. `v0.2.0`, `v0.3.0` and `v0.4.0` were then tagged and pushed,
# and **nothing failed**, because no check compared a deferral's target tag
# against the version the repository had actually reached. Ten Repo 4 tasks sat
# blocked for six days on a decision that had already been taken.
#
# ADR-KEM-012 recorded that as a process defect rather than an oversight, and
# named the missing control:
#
#   "A deferral needs an owner, not just a target tag. [...] the target tag
#    passed three times and nothing failed, because no check compares a
#    deferral's target against the current version."
#
# `tools/validate/deferrals.mjs` is that check and this is the data it reads.
# A deferral that is not in this file is invisible to it, so the register is
# also checked against the ADR prose that produced it.
#
# What a well-formed deferral needs
# ---------------------------------
# `target`      — one of `tag:` (comparable against package.json's version),
#                 `wave:` or `gate:` (not comparable; see the caveat below).
# `decision_owner` — who takes the decision, not who is waiting for it. The
#                 ADR-KEM-009 defect was that this was nobody.
# `owning_task` — the task that raises it. A deferral that closes a task
#                 without creating one is indistinguishable from a decision not
#                 to do it.
#
# The caveat, stated rather than hidden
# -------------------------------------
# Only `target.tag` is machine-comparable. A deferral targeted at a wave or a
# gate cannot be matured automatically, because neither has a value this
# repository holds. Those deferrals are counted, printed on every run, and
# ratcheted by `unassigned_owner_baseline` below — they are not silently
# passed over. Converting one to a tag target is what makes it enforceable.

schema_version: "1.0.0"

# The version this register is compared against comes from package.json and
# nowhere else — see tools/derive/version.py for why that rule exists.
contract_version_source: package.json

# Deferrals whose `decision_owner` is UNASSIGNED. This is a ratchet: the check
# fails if the count exceeds this number, so a new ownerless deferral cannot be
# added quietly. It may only be lowered, by assigning an owner.
unassigned_owner_baseline: 5

deferrals:

