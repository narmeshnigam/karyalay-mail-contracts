  # failing. The fixture in tools/validate/fixtures/ replays exactly this.
  # --------------------------------------------------------------------------

  - id: AI-12
    title: Canonical action envelope — action_id, idempotency_key, actor/service, reason_code, evidence refs, precondition version, result/observed state
    source: karyalay-mail-ops Appendix AI
    deferred_by: ADR-KEM-009
    deferred_on: 2026-08-18
    target:
      tag: v0.2.0
    decision_owner: karyalay-mail-contracts
    owning_task: null
    owning_task_missing_reason: >-
      ADR-KEM-009 sequenced AI-12 as "the v0.2.0 opening item" and created no
      task to author it. This is the defect ADR-KEM-012 names.
    status: MISSED_THEN_HONOURED
    missed_at: [v0.2.0, v0.3.0, v0.4.0]
    honoured_in: v0.5.0
    honoured_by: ADR-KEM-012
    satisfied_by:
